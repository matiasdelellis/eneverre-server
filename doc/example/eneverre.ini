[server]
; This whole file is optional: with no eneverre.ini present Eneverre runs on
; the defaults below. (An explicit --config / ENEVERRE_CONFIG_PATH that points
; at a missing file is still an error.)
;
; The admin user is NOT configured here — user management lives in the
; database. On first run an admin is created with a random password logged
; once (see journalctl), or with ENEVERRE_ADMIN_USER / ENEVERRE_ADMIN_PASS
; when those env vars are set. Either way the first web login forces the admin
; to set a new password before the app opens.
host = 0.0.0.0
port = 8080
; Log level: debug, info (default), warn, error. Overridden by the --log-level
; flag or ENEVERRE_LOG_LEVEL env var. The access-log prints one INFO line per
; request. Set to warn to silence them, at the cost of losing the access-log
; for every other request.
;log_level = info
;
; Read timeout for HTTP request bodies. Default 5m, which is enough for
; publishing a ~200 MiB APK over a 5 Mbps link. The default of 5m is
; generous but bounded — a slow-trickle client still gets cut off. Bump
; when the CI is on a particularly slow link; shrink when the API is
; fronted by a reverse proxy that already enforces a tighter limit.
; Format: time.ParseDuration ("5m", "30s", "1h"). Precedence: this key
; > ENEVERRE_READ_TIMEOUT > 5m.
;read_timeout = 5m
;
; Metrics endpoints (/api/metrics + /api/metrics/json). On by default. They are
; open to a local scraper over loopback and require auth from anywhere else, so
; nothing sensitive is exposed publicly (camera metrics are aggregate counts,
; no per-camera id). Set to false to drop the endpoints entirely if you don't
; scrape them. See doc/MEDIA.md#metrics.
;metrics = true
;
; Browser CORS allowlist (comma-separated Origins). Empty (default) is
; permissive: any Origin is reflected. This is safe when the web UI is served
; same-origin and the apps authenticate with Bearer tokens (not cookies), but
; you can lock the browser surface to known front-ends. A single "*" entry
; keeps the permissive read behavior but never sets Allow-Credentials.
;cors_origins = https://cams.example.com, https://nvr.example.com

; Reverse proxies whose X-Forwarded-For / X-Real-IP are honored when resolving
; the client IP for the access log and the security log (the IP fail2ban
; bans). Comma-separated IPs or CIDRs. Empty (default) trusts loopback only —
; right for the same-host Caddy setup. Use "none" when eneverre is exposed
; directly with no proxy.
;trusted_proxies = 192.168.1.10, 10.0.0.0/24

;[auth]
; Token lifetimes (defaults shown). Access is the Bearer-token life. TV
; (device-login) sessions get the same access life plus a refresh token, so a
; client that uses it does not need to re-pair; older clients keep re-pairing.
; Refresh is the password/device renewal window, slid forward on every refresh.
; A consumed refresh token replayed within 30s is retried without revoking the
; session; a later replay revokes it.
;access_token_ttl_hours = 24
;refresh_token_ttl_days = 90
;
; Background token cleanup interval in minutes. A periodic goroutine deletes
; expired tokens so the table stays lean between user logins. 0 or negative
; disables the background loop (cleanup still runs on each login). Precedence:
; this key > ENEVERRE_TOKEN_CLEANUP_INTERVAL > 60 (1h). Set to a higher value
; on low-traffic installs to avoid waking the DB too often, or to 0 to keep
; login-time cleanup only.
;cleanup_interval_minutes = 60
;
; Grace period in hours: a token stays visible in the sessions list for this
; long after it expires before the cleaner deletes it. This lets the frontend
; display an "expired" section alongside the active sessions instead of having
; them disappear the moment they lapse. Default 24 (1 day). 0 deletes expired
; tokens immediately (previous behaviour). Precedence: this key >
; ENEVERRE_TOKEN_CLEANUP_GRACE_HOURS > 24.
;cleanup_grace_hours = 24
;
; Security event log. When set, authentication failures are written here in a
; stable one-line-per-event format for intrusion-prevention tools (fail2ban,
; CrowdSec) to tail and ban abusive IPs. Events are ALSO logged to the main
; log at WARN, so leaving this unset just means "no dedicated file". The path
; must be writable by the eneverre process; its directory is not created for
; you. Rotate it with logrotate's `copytruncate`. Precedence: this key >
; ENEVERRE_SECURITY_LOG > "" (disabled). See doc/security-logging.md.
;security_log = /var/log/eneverre/security.log

;[media]
; Embedded media engine. The engine is always built for cameras with a
; `source` URL. **Live MSE browser feed, RTSP relay and disk recording are
; all on by default** (no [media] needed) — that's the point of the app. The
; optional [media] section tunes the engine and can opt out of any switch.
;
; Three independent on/off switches:
;   mse    = true|false   (default true)   — global toggle for live MSE feed
;   relay  = true|false   (default true)   — global toggle for RTSP relay
;   record = true|false   (default true)   — global toggle for disk recording
;
; Each switch can also be turned off for a single camera, from the web UI
; (or, on a fresh install, in a cameras.d seed file — see doc/example/README.md).
; The global and the per-camera value are ANDed, so a per-camera key can only
; turn a switch OFF, never back on when the global one is false.
;
; Examples:
;   mse = false                   ; turn the MSE feed off globally
;   relay = false                 ; turn the RTSP relay off globally
;   record = false                ; live-only: no disk writes, /recordings/* 404
;
; Where recordings and the segment index live. When record_dir is unset the
; engine prefers /var/lib/eneverre/recordings if that directory exists
; (the systemd/FHS install), and otherwise falls back to
; <data_dir>/recordings so a self-contained data dir (--data-dir) keeps its
; recordings next to its config and DB.
;record_dir = /var/lib/eneverre/recordings
;index_path = /var/lib/eneverre/recordings/index.db
; Cache for generated assets (e.g. the black "NO RECORDING" gap-fill frames,
; one tiny .h264 per resolution under <cache_dir>/gapfill/). Persisted so they
; survive restarts (generated once with ffmpeg). Default: <record_dir>/../cache.
; Keep it under a writable path (e.g. /var/lib/eneverre) given ProtectSystem.
;cache_dir = /var/lib/eneverre/cache
; Segment path pattern (must contain %path and time specifiers incl. %f).
; The default is `<record_dir>/%path/%Y-%m-%d/%H/%Y-%m-%d_%H-%M-%S-%f`, so
; a recording started at 10:30:45.123456 on 2025-01-15 for camera01 lives
; at `<record_dir>/camera01/2025-01-15/10/2025-01-15_10-30-45-123456.mp4`.
; Each camera's day is its own subtree, which keeps the file count per
; directory small even on installations with many cameras. The full
; timestamp in the filename keeps segments uniquely named across day
; and hour boundaries. The `retain` option above wipes old segments by
; index (not by file path), so the layout is independent of the
; rotation policy.
;record_path = /var/lib/eneverre/recordings/%path/%Y-%m-%d/%H/%Y-%m-%d_%H-%M-%S-%f
; Minimum segment length and fMP4 fragment length (time.ParseDuration format).
; part_duration is the recovery-point objective: on a hard crash at most this
; much of the open segment (buffered but not yet flushed) is lost.
;segment_duration = 60s
;part_duration = 1s
; Max size of a single fMP4 fragment/part before it is forced out (K/M/G suffix,
; base 1024). A safety valve against RAM growth if a keyframe interval is huge;
; the default is plenty for normal streams.
;max_part_size = 50M
; Delete recordings older than this. Default: 7d. Set to 0 to keep forever.
; Accepts any time.ParseDuration value plus a "d" suffix for days (e.g. 10d = 240h).
; Motion events (the [events] webhook timeline) are pruned on this same window,
; so they never outlive the footage they point at.
;retain = 7d
; Force-purge the oldest recordings when the recording volume's free space
; drops below this mark. Default: 1G. When crossed, a WARN is logged and an
; emergency purge force-removes the oldest segments — regardless of [media]
; retain — until free space is back above 2x this mark. Recording is never
; paused: the oldest footage is sacrificed to make room for the newest, so
; the disk never fills. Set to 0 to disable the check (the operator takes
; responsibility for disk headroom). The current state is reported on
; GET /api/status under `storage.low_space` and `storage.low_space_since`.
; Accepts the same "K/M/G" suffixes as max_part_size above.
;min_free_bytes = 1G
; RTSP relay listen address (the server that re-serves the live streams).
;rtsp_address = :8554
; Public hostname clients use to reach the RTSP relay, embedded in the `rtsp`
; URL of /api/cameras (rtsp://<rtsp_host>:<port>/<id>/<exp>.<sig>). When unset,
; the host is taken from the request (works out of the box on a LAN); set this
; to pin a public host behind a reverse proxy, where the API and relay hosts
; differ. The web UI uses live_mse regardless.
;rtsp_host = nvr.example.com
; RTSP source transport for recording: auto (default: UDP with TCP fallback),
; tcp (reliable, cleanest on lossy links), or udp. Can be overridden per camera
; with a `transport` key in the camera's INI.
;transport = auto
; Caption burned into the gap-fill black frame (see /get). UTF-8 ok (accents,
; etc.). Changing it regenerates the cached asset. Default: "NO RECORDING".
;gap_message = NO RECORDING
; The RTSP relay uses a short-lived (6h) HMAC token in the path per camera,
; minted by /api/cameras. There is no global username/password or rotation.
; For remote clients put the relay behind a VPN/TLS tunnel; the relay itself
; is plain RTSP over TCP.

;[events]
; Required to accept the motion webhook (POST /api/camera/{id}/events). Send
; this secret in the X-Webhook-Secret header. There is no query-string form:
; the secret must not end up in URLs or proxy logs.
; Without this key the webhook returns 503.
;webhook_secret = change-me
;
; When the webhook records a motion event, it extends the event range to
; the union of [start - pre_seconds, end + post_seconds]. The defaults
; (5 + 5) make a single event cover a 10-second window centered on the
; trigger, which is what the apps' playback timeline expects. Bump them
; if your source fires short bursts you want to widen, or if you want a
; bigger "post-roll" so the timeline highlights the few seconds after
; motion stops.
;pre_seconds  = 5
;post_seconds = 5
;
; There is no separate event-retention knob: motion events are pruned on the
; same window as recordings ([media] retain). With retain set, a background
; sweep (hourly, plus once at startup) drops events older than it so the events
; table never outlives the footage its rows reference. Without retain, events
; are kept forever.

;[updates]
; Auto-update server for the Android clients (EneverreTV, phone app). When
; the section is absent and ENEVERRE_UPDATES_DIR is unset, all /api/app/*
; endpoints return 503 (feature off).
;
; Each client "track" lives in its own subdirectory under storage_dir and
; stores <track>/manifest.json + the uploaded APKs next to it. Track names are
; arbitrary operator/CI-chosen identifiers ("tv", "phone", "tablet", ...): the
; server keeps no fixed list, publishing to a new name is enough to start
; serving it. The endpoint layout is /api/app/<track>/update (GET),
; POST /api/admin/app/updates/<track> (publish), and
; /api/app/updates/<track>/<filename> (GET) for downloads. See doc/UPDATES.md.
;
; The feature is off unless one of these is set: with neither, all /api/app/*
; endpoints return 503. Precedence: [updates] storage_dir >
; ENEVERRE_UPDATES_DIR > "" (disabled).
;storage_dir = /var/lib/eneverre/app-updates
;
; The public base URL the manifest's `builds[i].url` field is rooted at.
; **Recommended** in production: this is the operator's authoritative
; source of truth for the URL the Android clients use to download each
; APK. Without it, the server falls back to auto-detecting the scheme and
; host from the request (honoring `X-Forwarded-Proto` / `X-Forwarded-Host`,
; falling back to `r.TLS` and `r.Host`). Behind a TLS-terminating reverse
; proxy (Caddy, Nginx, Cloudflare) the auto-detection only works if the
; proxy is configured to send those headers — which is not the default
; in Caddy. Setting `public_base_url` here is the simplest fix and works
; behind any proxy with zero extra config.
;
; Each builds[i].url becomes <public_base_url>/api/app/updates/<track>/<filename>.
; The equivalent env var is ENEVERRE_UPDATES_PUBLIC_BASE_URL.
;public_base_url = https://updates.example.com
;
; Optional publish-only bearer token. When set, the publish endpoint
; (POST /api/admin/app/updates/<track>) requires
; `Authorization: Bearer <token>` and reject user/password and session
; Bearer tokens — only the dedicated token works. Leave empty to keep the
; historical behavior (publish requires an admin user). Precedence:
; [updates] publish_token > ENEVERRE_UPDATES_PUBLISH_TOKEN.
; Generate with `openssl rand -hex 32` (or any 32+ char high-entropy
; secret). Rotating the token revokes CI access immediately; it does not
; affect user logins.
;publish_token = change-me-to-a-32-byte-secret
;
; No release history is kept. At every commit the previous release's
; APKs are deleted, so disk usage is bounded by the current release's
; APKs. A client that started downloading the previous release will get
; a 404 from the moment the new commit lands. (For true in-flight
; support across publishes, use the multi-POST finalize=false flow so a
; single release is built up across many requests before any old APK is
; deleted.)
;
; Hard cap on the publish request body (multipart + APK). Accepts a
; decimal byte count or a K/M/G suffix (1024-based). Enforced via
; http.MaxBytesReader, so a 413 is returned as soon as the body crosses
; the limit (the client may abort the upload before sending the rest).
; Precedence: [updates] max_build_size > ENEVERRE_UPDATES_MAX_BUILD_SIZE
; > 100M default. Bump this if your universal APKs exceed 100 MiB
; (current TV universals are ~50-70 MiB, so 100 MiB has comfortable
; headroom; if you ship a larger build, raise this or split into
; per-ABI POSTs).
;max_build_size = 100M

;[zaguan]
; Publish the cameras of this server to a Zaguán hub as one source. The
; hub owns the devices of the home; Eneverre is one of its providers, so the
; family app can list the cameras next to the lights and the sensors. The
; integration is off unless `url` and a token are configured.
;
; Create the source in the hub UI (Sources -> New, kind `eneverre`) and
; copy the `zsrc_...` token it shows once. The token is the only secret the
; integration needs; the hub stores only its hash. See doc/ZAGUAN.md.
;url = http://192.168.1.20:8081
;
; The read-only file with the source token (mode 0600), recommended over
; `token` so the secret stays out of this INI. An unreadable or empty file
; is an error and never falls back to the inline token.
;token_file = /etc/eneverre/zaguan.token
;
; Inline alternative. Precedence: token_file > ENEVERRE_ZAGUAN_TOKEN_FILE >
; token > ENEVERRE_ZAGUAN_TOKEN.
;token = zsrc_kid_secret
;
; The name shown in the hub's Sources page. Default: Eneverre.
;name = Eneverre
;
; Base URL this server is reached at by the hub and its clients. It is used
; to build the absolute media links published in the camera entity
; attributes: the live MSE stream and info, the last-hour HLS VOD playlist
; and the thumbnail. The RTSP relay URL still works without it when
; [media] rtsp_host is set. The HTTP media links carry short-lived signed
; grants (exp/sig) scoped to one camera and one surface; they are accepted
; without an Eneverre login. Eneverre has no HLS live mode: live is MSE, HLS
; is recorded VOD.
;public_url = https://cams.example.com
;
; How often the camera inventory is rebuilt and republished. The snapshot is
; also what refreshes connectivity/availability in the hub (there are no
; per-state events in this integration). Values shorter than 1s are ignored.
; Default: 30s.
;sync_interval = 30s
